# Shenglan Chen — academic website (Jekyll, GitHub Pages)
# Page text lives in _data/*.yml (English and French side by side).
# See HOW-TO-EDIT.md for how to update content.

title: Shenglan Chen
author: Shenglan Chen
url: "https://shenglanchen.github.io"
baseurl: ""
timezone: Europe/Paris

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-sitemap

# Files from the previous theme (beautiful-jekyll) are kept in the folder
# but no longer published. They can be deleted safely.
exclude:
  - HOW-TO-EDIT.md
  - README.md
  - CHANGELOG.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Appraisals
  - beautiful-jekyll-theme.gemspec
  - screenshot.png
  - staticman.yml
  - docs/
  - vendor/
  - aboutme.md
  - Projects.md
  - 404.html
  - tags.html
  - feed.xml
  - assets/css/
  - assets/js/
  - assets/data/
  - assets/PDFs/CV
  - assets/img/404-southpark.jpg
  - assets/img/avatar-icon.png
  - assets/img/bgimage.png
  - assets/img/crepe.jpg
  - assets/img/path.jpg
  - assets/img/thumb.png
