bio:
  en: I hold an MSc in Cognitive Science (HCI track) from Université Lumière Lyon 2 and a BSc in scientific psychology from Université Paris Cité. Across four research internships I have run experiments with fNIRS, eye-tracking and physiological measures, most recently on take-over in automated driving at the EMC Lab with Jordan Navarro.
